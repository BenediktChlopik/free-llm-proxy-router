- capability: code
  keywords: ["coder", "code", "codestral", "deepseek-coder", "starcoder", "codegen", "qwen-coder", "instruct-code"]

- capability: reasoning
  keywords: ["r1", "reasoning", "think", "qwq", "o1", "thinking"]

- capability: long_context
  keywords: ["128k", "200k", "1m", "long-context", "longctx", "longcontext", "128000", "200000", "1000000", "1048576"]

- capability: audio
